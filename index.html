<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#12142e">
  <title>Memory Match</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Memory Match">
  <!-- When any file below changes, change the ?v= tag on all four so browsers fetch the new copies. -->
  <link rel="stylesheet" href="styles.css?v=2026-11-14b">
</head>
<body>
  <div class="backdrop" aria-hidden="true"></div>

  <!-- ============ SETUP SCREEN ============ -->
  <main id="setup" class="screen active">
    <div class="setup-scroll">
      <header class="hero">
        <div class="logo" aria-hidden="true">
          <span class="logo-card lc1">✦</span>
          <span class="logo-card lc2">★</span>
        </div>
        <h1>Memory Match</h1>
        <p>Flip two cards. Find a pair, keep it and go again. Miss, and the next player is up.</p>
      </header>

      <section class="panel" aria-labelledby="h-players">
        <div class="panel-head">
          <h2 id="h-players">Players</h2>
          <div class="segmented" id="player-count" role="radiogroup" aria-label="Number of players"></div>
        </div>
        <div class="names" id="names"></div>
        <p class="hint">Names are optional.</p>
      </section>

      <section class="panel" aria-labelledby="h-level">
        <div class="panel-head">
          <h2 id="h-level">Difficulty</h2>
        </div>
        <div class="levels" id="levels" role="radiogroup" aria-label="Difficulty"></div>
      </section>

      <section class="panel" aria-labelledby="h-theme">
        <div class="panel-head">
          <h2 id="h-theme">Card style</h2>
        </div>
        <div class="themes" id="themes" role="radiogroup" aria-label="Card style"></div>
      </section>

      <section class="panel" id="panel-math" aria-labelledby="h-math" hidden>
        <div class="panel-head">
          <h2 id="h-math">Math level</h2>
        </div>
        <div class="levels" id="math-levels" role="radiogroup" aria-label="Math level"></div>
        <p class="hint" id="math-hint"></p>
      </section>
    </div>

    <footer class="setup-footer">
      <div class="summary" id="summary"></div>
      <button class="btn primary big" id="start-btn" type="button">Start game</button>
    </footer>
  </main>

  <!-- ============ GAME SCREEN ============ -->
  <main id="game" class="screen">
    <header class="topbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true">✦</span><span class="brand-name">Memory Match</span></div>
      <div class="progress" aria-live="polite">
        <div class="progress-text"><span id="progress-label">0 of 8 pairs found</span><span id="level-label"></span></div>
        <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
      </div>
      <div class="controls">
        <button class="icon-btn" id="sound-btn" type="button" aria-label="Sound on" title="Sound">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path class="spk" d="M4 9v6h4l5 4V5L8 9H4z"/><path class="wave" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"/><path class="mute" d="M17 9l5 6M22 9l-5 6"/></svg>
        </button>
        <button class="icon-btn" id="fs-btn" type="button" aria-label="Full screen" title="Full screen">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg>
        </button>
        <button class="btn ghost" id="restart-btn" type="button">Restart</button>
        <button class="btn ghost" id="menu-btn" type="button">Settings</button>
      </div>
    </header>

    <section class="players" id="players" aria-label="Scores"></section>

    <section class="board-wrap" id="board-wrap">
      <div class="board" id="board"></div>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </section>
  </main>

  <div class="modal-layer" id="modal-layer" hidden>
    <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"></div>
  </div>
  <canvas id="confetti" aria-hidden="true"></canvas>

  <script src="themes.js?v=2026-11-14b"></script>
  <script src="math.js?v=2026-11-14b"></script>
  <script src="game.js?v=2026-11-14b"></script>
</body>
</html>
